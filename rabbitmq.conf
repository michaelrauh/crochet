# RabbitMQ Configuration
# Setting the memory high watermark to 60%
vm_memory_high_watermark.relative = 0.6

# Disk free space limit to 1GB
disk_free_limit.absolute = 1GB

# Load the definitions file to pre-configure queues
management.load_definitions = /etc/rabbitmq/definitions.json

# Improve performance with these settings
prefetch_count = 50
consumer_timeout = 1800000

# TCP buffer size for better network performance
tcp_listen_options.backlog = 128
tcp_listen_options.buffer = 196608
tcp_listen_options.sndbuf = 196608
tcp_listen_options.recbuf = 196608

# Allow the server to reduce memory consumption during high load
memory_alarms = true

# Message size limit to prevent excessive memory consumption
consumer_timeout = 300000

# Improve performance for our use case
queue_master_locator = min-masters
queue_index_embed_msgs_below = 4096